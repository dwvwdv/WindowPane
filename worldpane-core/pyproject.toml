[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worldpane-core"
version = "0.1.0"
description = "WorldPane（窗間）Simulation Core：決定性的多人每日生活排程引擎"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # zoneinfo 在 Linux/macOS 使用系統時區資料；Windows 需要 tzdata。
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
worldpane-core = "worldpane_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
