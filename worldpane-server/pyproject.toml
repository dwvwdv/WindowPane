[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "worldpane-server"
version = "0.1.1"
description = "WorldPane (窗間) backend API: Display API, device pairing, world history."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    # Install together with the sibling package: pip install -e ../worldpane-core -e .
    "worldpane-core",
    "psycopg[binary,pool]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worldpane_server = ["static/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
