name: Core

on:
  push:
    branches: [main, master]
    paths:
      - 'worldpane-core/**'
      - 'supabase/seed.sql'
      - '.github/workflows/core.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'worldpane-core/**'
      - 'supabase/seed.sql'
      - '.github/workflows/core.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: worldpane-core/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: worldpane-core

      - name: Run tests
        run: pytest --tb=short
        working-directory: worldpane-core

      - name: seed.sql is up to date
        run: python scripts/gen_seed_sql.py --check ../supabase/seed.sql
        working-directory: worldpane-core
