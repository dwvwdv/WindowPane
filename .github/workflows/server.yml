name: Server

on:
  push:
    branches: [main, master]
    paths:
      - 'worldpane-server/**'
      - 'worldpane-core/**'
      - 'supabase/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'worldpane-server/**'
      - 'worldpane-core/**'
      - 'supabase/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dwvwdv/worldpane-server

jobs:
  test:
    name: Test (memory + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Throwaway CI database: every test wipes it and re-applies supabase/seed.sql.
      WORLDPANE_TEST_DATABASE_URL: postgresql://service_role:ci@localhost:5432/wp_test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            worldpane-core/pyproject.toml
            worldpane-server/pyproject.toml

      - name: Install dependencies
        run: pip install -e ../worldpane-core -e ".[dev]"
        working-directory: worldpane-server

      - name: Apply Supabase roles, migrations and seed
        # Same script the bundled Postgres runs on first start (docker compose --profile local-db).
        run: sh docker/db/init-worldpane.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: wp_test
          WORLDPANE_DB_PASSWORD: ci
          WORLDPANE_SUPABASE_DIR: supabase

      - name: Run tests
        run: pytest --tb=short
        working-directory: worldpane-server

      - name: openapi.json is up to date
        run: python scripts/export_openapi.py --check
        working-directory: worldpane-server

  docker:
    name: Docker Build, Smoke Test & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: worldpane-server/Dockerfile
          load: true
          tags: |
            worldpane-server:latest
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (docker compose --profile local-db)
        env:
          WORLDPANE_ADMIN_TOKEN: ci-admin-token-0123456789
        run: |
          docker compose --profile local-db up -d --no-build --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8000/dashboard
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/world -H 'Content-Type: application/json' -d '{"name":"CI"}' > world.json
          token=$(python3 -c "import json; print(json.load(open('world.json'))['device']['device_token'])")
          curl -fsS http://127.0.0.1:8000/api/v1/world/state -H "Authorization: Bearer $token"
          curl -fsS http://127.0.0.1:8000/api/v1/admin/monitor -H "Authorization: Bearer $WORLDPANE_ADMIN_TOKEN" > /dev/null

      - name: Logs on failure
        if: failure()
        run: docker compose --profile local-db logs

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${{ github.sha }}"
